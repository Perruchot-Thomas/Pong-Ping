# A ajouter en fin de /etc/apache2/sites-available/000-default.conf
# Remplacer pongping.<votredomaine>.<tld> par le vrai sous-domaine.
# Modules nécessaires : proxy proxy_http proxy_wstunnel rewrite headers ssl

<VirtualHost *:443>
    ServerName pongping.<votredomaine>.<tld>
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/pongping.<votredomaine>.<tld>/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/pongping.<votredomaine>.<tld>/privkey.pem

    ProxyPreserveHost On

    # Le jeu utilise des WebSockets : il faut les faire suivre aussi
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/?(.*) ws://localhost:3001/$1 [P,L]

    ProxyPass / http://localhost:3001/
    ProxyPassReverse / http://localhost:3001/
</VirtualHost>
